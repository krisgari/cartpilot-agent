name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q          # deterministic: no API key, no network

  eval:
    # Runs the live-model eval. Manual trigger only (it spends tokens). Add ANTHROPIC_API_KEY as a repo secret.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/evaluate.py --output results.json   # non-zero exit fails the job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results.json
